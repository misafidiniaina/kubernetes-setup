name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Run Gherkin feature scenarios
        run: go test -race ./features

      - name: Run static analysis
        run: go vet ./...

      - name: Build CLI
        run: go build ./...
