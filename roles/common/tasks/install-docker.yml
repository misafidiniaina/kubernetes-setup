---
- name: Install Docker
  when: container_runtime == 'docker'
  block:
    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_distribution == 'Ubuntu'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: ansible_distribution == 'Ubuntu'

    - name: Install Docker
      package:
        name: docker-ce={{ docker_version }}-1~ubuntu.{{ ansible_distribution_release | lower }}~{{ ansible_distribution_version.split('.')[0] }}.04.1
        state: present
      when: docker_version is defined

    - name: Install latest Docker
      package:
        name: docker-ce
        state: present
      when: docker_version is not defined

    - name: Create docker daemon config
      template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        backup: true
      notify: Restart Docker

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
